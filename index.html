<!DOCTYPE html>
<html lang="en">

<head>

    <!-- *------ SEO ------* -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A responsive news website powered by News API, allowing users to browse and search the latest news across different categories.">

    <meta name="keywords"
        content="News, News API, Latest News, Breaking News, Business News, Technology News, Sports News, Health News">

    <meta property="og:title" content="News">
    <meta property="og:url" content="https://mando157.github.io/News/" />

    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/style.responsive.css">

    <title>News</title>
</head>

<body>
    <div class="container">
        <section id="Filter">
            <form action="" class="d-flex flex-column flex-md-row">
                <div class="input-group">
                    <label class="input-group-text" for="inputGroupSelect01">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </label>

                    <select class="form-select" id="Category">
                        <option value="general" selected>general</option>
                        <option value="business">business</option>
                        <option value="health">health</option>
                        <option value="science">science</option>
                        <option value="sports">sports</option>
                        <option value="technology">technology</option>
                        <option value="entertainment">entertainment</option>
                    </select>
                </div>

                <div class="input-group">
                    <span class="input-group-text" id="basic-addon1">
                        <i class="fa-solid fa-magnifying-glass fa-swing"></i>
                    </span>
                    <input type="text" id="Search" class="form-control" placeholder="Search Here!">
                </div>

                <button class="button btn btn-info">Filter</button>
                <input class="button btn btn-danger" type="reset">
            </form>
        </section>

        <section id="Body">

            <div class="content row mb-5 row-gap-4">

            </div>

            <nav class="pagination-container">
                <ul class="pagination">
                </ul>
            </nav>
        </section>

    </div>
    <script src="./js/bootstrap.bundle.js"></script>
    <script src="./js/jquery.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
